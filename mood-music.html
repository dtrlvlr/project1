<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎵 오늘의 기분 노래 추천</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --card2: #16213e;
      --accent: #7c3aed;
      --accent2: #a855f7;
      --accent3: #06b6d4;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: rgba(124, 58, 237, 0.25);
    }

    body {
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px 16px 60px;
      overflow-x: hidden;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(124,58,237,0.18), transparent 70%);
      top: -200px; left: -200px;
    }
    body::after {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(6,182,212,0.12), transparent 70%);
      bottom: -150px; right: -150px;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
    }

    /* ─── header ─── */
    .header {
      text-align: center;
      margin-bottom: 36px;
    }
    .header .logo {
      font-size: 2.8rem;
      animation: float 3s ease-in-out infinite;
      display: inline-block;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }
    .header h1 {
      font-size: 1.9rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a855f7, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-top: 8px;
    }
    .header p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 6px;
    }

    /* ─── progress ─── */
    .progress-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
      justify-content: center;
    }
    .prog-dot {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.78rem;
      font-weight: 800;
    }
    .prog-dot.done   { background: #a855f7; color: white; }
    .prog-dot.active { background: linear-gradient(135deg, #7c3aed, #a855f7); color: white;
                       box-shadow: 0 0 14px rgba(168,85,247,0.55); }
    .prog-dot.todo   { background: #16213e; color: var(--muted);
                       border: 1px solid rgba(124,58,237,0.25); }
    .prog-line { width: 44px; height: 2px; background: rgba(124,58,237,0.2); border-radius: 2px; }
    .prog-line.done { background: #a855f7; }

    /* ─── step card ─── */
    .step-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      margin-bottom: 20px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }
    .step-card.hidden { display: none; }
    .step-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #a855f7;
      margin-bottom: 8px;
    }
    .step-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .step-sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    /* ─── mood grid ─── */
    .mood-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
      gap: 12px;
    }
    .mood-btn {
      background: var(--card2);
      border: 2px solid transparent;
      border-radius: 16px;
      padding: 18px 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.22s;
    }
    .mood-btn:hover {
      border-color: #a855f7;
      transform: translateY(-3px);
      box-shadow: 0 6px 24px rgba(168,85,247,0.25);
    }
    .mood-btn.selected {
      border-color: #a855f7;
      background: linear-gradient(135deg, rgba(124,58,237,0.25), rgba(168,85,247,0.12));
      box-shadow: 0 0 0 3px rgba(168,85,247,0.18);
    }
    .mood-btn .emoji { font-size: 1.9rem; display: block; margin-bottom: 7px; }
    .mood-btn .mood-name { font-size: 0.87rem; font-weight: 700; color: var(--text); }
    .mood-btn .mood-desc { font-size: 0.72rem; color: var(--muted); margin-top: 3px; }

    /* ─── genre grid ─── */
    .genre-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .genre-btn {
      background: var(--card2);
      border: 2px solid transparent;
      border-radius: 30px;
      padding: 9px 18px;
      cursor: pointer;
      font-size: 0.87rem;
      font-weight: 600;
      color: var(--muted);
      transition: all 0.2s;
    }
    .genre-btn:hover { border-color: #06b6d4; color: var(--text); }
    .genre-btn.selected {
      border-color: #06b6d4;
      background: rgba(6,182,212,0.12);
      color: #06b6d4;
      box-shadow: 0 0 0 3px rgba(6,182,212,0.12);
    }

    /* ─── buttons ─── */
    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: white; border: none; border-radius: 12px;
      padding: 13px 26px; font-size: 0.97rem; font-weight: 700;
      cursor: pointer; margin-top: 22px;
      transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(124,58,237,0.4);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(124,58,237,0.55); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-secondary {
      display: inline-flex; align-items: center; gap: 8px;
      background: transparent; color: var(--muted);
      border: 1px solid rgba(124,58,237,0.25);
      border-radius: 12px; padding: 11px 20px;
      font-size: 0.88rem; font-weight: 600;
      cursor: pointer; margin-top: 12px; margin-left: 10px;
      transition: all 0.2s;
    }
    .btn-secondary:hover { border-color: #a855f7; color: var(--text); }

    /* ─── result ─── */
    #result-section { display: none; }

    .result-header { text-align: center; margin-bottom: 26px; }
    .mood-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, rgba(124,58,237,0.25), rgba(6,182,212,0.12));
      border: 1px solid rgba(124,58,237,0.25);
      border-radius: 30px; padding: 7px 16px;
      font-size: 0.9rem; font-weight: 600; margin-bottom: 10px;
    }
    .result-header h2 { font-size: 1.4rem; font-weight: 800; }
    .result-header p { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }

    /* ─── song cards ─── */
    .song-list { display: flex; flex-direction: column; gap: 10px; }

    .song-card {
      background: var(--card2);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex; align-items: center; gap: 14px;
      transition: all 0.2s;
      animation: slideUp 0.4s ease forwards;
      opacity: 0;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .song-card:hover {
      border-color: #a855f7;
      transform: translateX(4px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .song-num {
      font-size: 1rem; font-weight: 800; color: #a855f7;
      min-width: 24px; text-align: center;
    }
    .song-cover {
      width: 48px; height: 48px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; flex-shrink: 0;
    }
    .song-info { flex: 1; min-width: 0; }
    .song-title {
      font-size: 0.95rem; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .song-artist { font-size: 0.8rem; color: var(--muted); margin-top: 3px; }
    .song-genre-tag {
      font-size: 0.7rem; font-weight: 700; padding: 3px 8px;
      border-radius: 20px; flex-shrink: 0;
    }
    .youtube-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: #ff0000; color: white; border: none;
      border-radius: 8px; padding: 6px 11px;
      font-size: 0.77rem; font-weight: 700; cursor: pointer;
      text-decoration: none; transition: all 0.2s; flex-shrink: 0;
    }
    .youtube-btn:hover { background: #cc0000; transform: scale(1.05); }

    .shuffle-notice {
      text-align: center; color: var(--muted); font-size: 0.82rem;
      margin-top: 18px; padding: 12px;
      background: rgba(255,255,255,0.03); border-radius: 10px;
    }

    .footer {
      text-align: center; margin-top: 36px;
      color: var(--muted); font-size: 0.8rem;
    }

    @media (max-width: 480px) {
      .mood-grid { grid-template-columns: repeat(3, 1fr); }
      .step-card { padding: 20px 14px; }
      .header h1 { font-size: 1.45rem; }
      .song-genre-tag { display: none; }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="logo">🎵</div>
    <h1>오늘의 기분 노래 추천</h1>
    <p>기분을 알려주면 딱 맞는 노래를 골라드릴게요 — 고민 끝!</p>
  </div>

  <div class="progress-bar">
    <div class="prog-dot active" id="dot1">1</div>
    <div class="prog-line" id="line1"></div>
    <div class="prog-dot todo" id="dot2">2</div>
    <div class="prog-line" id="line2"></div>
    <div class="prog-dot todo" id="dot3">3</div>
  </div>

  <!-- Step 1: 기분 선택 -->
  <div class="step-card" id="step1">
    <div class="step-label">Step 1 · 기분 선택</div>
    <div class="step-title">오늘 하루 기분이 어때요?</div>
    <div class="step-sub">지금 이 순간 가장 가까운 감정을 골라주세요</div>
    <div class="mood-grid" id="mood-grid"></div>
    <div>
      <button class="btn-primary" id="btn-mood-next" disabled onclick="goToStep2()">
        다음 → 장르 선택
      </button>
    </div>
  </div>

  <!-- Step 2: 장르 선택 -->
  <div class="step-card hidden" id="step2">
    <div class="step-label">Step 2 · 장르 선택</div>
    <div class="step-title">어떤 장르가 좋아요? <span style="color:var(--muted);font-weight:400;font-size:0.95rem;">(복수 선택 가능)</span></div>
    <div class="step-sub">선택하지 않으면 모든 장르에서 추천해드려요</div>
    <div class="genre-grid" id="genre-grid"></div>
    <div>
      <button class="btn-primary" onclick="goToStep3()">🎲 노래 추천받기!</button>
      <button class="btn-secondary" onclick="goToStep1()">← 기분 다시 선택</button>
    </div>
  </div>

  <!-- Step 3: 결과 -->
  <div id="result-section">
    <div class="step-card">
      <div class="result-header">
        <div class="mood-badge" id="result-badge"></div>
        <h2 id="result-title"></h2>
        <p id="result-sub"></p>
      </div>
      <div class="song-list" id="song-list"></div>
      <div class="shuffle-notice">
        💡 매번 다른 조합으로 추천돼요. 마음에 안 들면 다시 뽑아보세요!
      </div>
      <div style="margin-top:8px;">
        <button class="btn-primary" onclick="shuffleAgain()">🔀 다시 추천받기</button>
        <button class="btn-secondary" onclick="restart()">← 처음부터</button>
      </div>
    </div>
  </div>

  <div class="footer">
    노래를 고르느라 시간 낭비하지 마세요 🎧<br>
    ▶ YouTube 버튼을 클릭하면 바로 검색돼요
  </div>
</div>

let selectedMood = null;
let selectedGenres = new Set();

function init() {
  const moodGrid = document.getElementById('mood-grid');
  moodGrid.innerHTML = MOODS.map(m => `
    <button class="mood-btn" data-id="${m.id}" onclick="selectMood('${m.id}')">
      <span class="emoji">${m.emoji}</span>
      <div class="mood-name">${m.name}</div>
      <div class="mood-desc">${m.desc}</div>
    </button>
  `).join('');

  const genreGrid = document.getElementById('genre-grid');
  genreGrid.innerHTML = GENRES.map(g => `
    <button class="genre-btn" data-genre="${g}" onclick="toggleGenre('${g}')">${GENRE_EMOJI[g]||'🎵'} ${g}</button>
  `).join('');
}

function selectMood(id) {
  selectedMood = id;
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
  document.querySelector('.mood-btn[data-id="'+id+'"]').classList.add('selected');
  document.getElementById('btn-mood-next').disabled = false;
}

function toggleGenre(g) {
  const btn = document.querySelector('.genre-btn[data-genre="'+g+'"]');
  if (selectedGenres.has(g)) { selectedGenres.delete(g); btn.classList.remove('selected'); }
  else { selectedGenres.add(g); btn.classList.add('selected'); }
}

function updateProgress(step) {
  [1,2,3].forEach(i => {
    const dot = document.getElementById('dot'+i);
    dot.className = 'prog-dot ' + (i < step ? 'done' : i === step ? 'active' : 'todo');
    dot.innerHTML = i < step ? '✓' : i;
  });
  [1,2].forEach(i => {
    document.getElementById('line'+i).className = 'prog-line' + (i < step ? ' done' : '');
  });
}

function goToStep1() {
  document.getElementById('step1').classList.remove('hidden');
  document.getElementById('step2').classList.add('hidden');
  document.getElementById('result-section').style.display = 'none';
  updateProgress(1);
  scrollTo({ top:0, behavior:'smooth' });
}

function goToStep2() {
  if (!selectedMood) return;
  document.getElementById('step1').classList.add('hidden');
  document.getElementById('step2').classList.remove('hidden');
  document.getElementById('result-section').style.display = 'none';
  updateProgress(2);
  scrollTo({ top:0, behavior:'smooth' });
}

function goToStep3() {
  buildRec();
  document.getElementById('step1').classList.add('hidden');
  document.getElementById('step2').classList.add('hidden');
  document.getElementById('result-section').style.display = 'block';
  updateProgress(3);
  scrollTo({ top:0, behavior:'smooth' });
}

function shuffleAgain() { buildRec(); scrollTo({ top:0, behavior:'smooth' }); }

function restart() {
  selectedMood = null;
  selectedGenres = new Set();
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
  document.querySelectorAll('.genre-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('btn-mood-next').disabled = true;
  goToStep1();
}

function buildRec() {
  const mood = MOODS.find(m => m.id === selectedMood);
  const msg  = MOOD_MESSAGES[selectedMood];
  let pool = SONGS[selectedMood] || [];
  if (selectedGenres.size > 0) {
    const f = pool.filter(s => selectedGenres.has(s.genre));
    if (f.length >= 3) pool = f;
  }
  const picks = [...pool].sort(() => Math.random() - 0.5).slice(0, 6);

  document.getElementById('result-badge').innerHTML = mood.emoji + ' ' + mood.name;
  document.getElementById('result-title').textContent = msg.title;
  document.getElementById('result-sub').textContent = msg.sub;

  document.getElementById('song-list').innerHTML = picks.map((s, i) => {
    const gc = GENRE_COLORS[s.genre] || ['rgba(255,255,255,0.1)','#94a3b8'];
    const ytUrl = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(s.q || s.title + ' ' + s.artist);
    return `
      <div class="song-card" style="animation-delay:${i*0.07}s">
        <div class="song-num">${i+1}</div>
        <div class="song-cover" style="background:${gc[0]}">${s.emoji}</div>
        <div class="song-info">
          <div class="song-title">${s.title}</div>
          <div class="song-artist">${s.artist}</div>
        </div>
        <div class="song-genre-tag" style="background:${gc[0]};color:${gc[1]}">${s.genre}</div>
        <a class="youtube-btn" href="${ytUrl}" target="_blank" rel="noopener">▶ YouTube</a>
      </div>
    `;
  }).join('');
}

init();
</script>
